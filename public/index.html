    });

    saveState({ rules: true });
  }

  // Wire auto-save to every input / select / checkbox in the modal. Holiday
  // and unit-meeting chip add/remove already call commitRules via the
  // wrapper installed at the end of buildEventChipUi (see render() inside
  // that helper). The non-chip inputs are listened to here.
  bg.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("input", commitRules);
    el.addEventListener("change", commitRules);
  });
}

// ---------- Auto-fill (Phase 2: server-side OR-tools CP-SAT) ----------
// All the heavy lifting now lives in python/optimizer.py. This client just
// asks the server, waits ~1 second, and applies the returned schedule.
async function autoFill() {
  if (checkLock()) return;
  if (!confirm(`จัดตารางอัตโนมัติสำหรับ ${currentMonthKey()}?`)) return;
  updateFileStatus('กำลังจัดตาราง…');
  const btn = document.getElementById('btnAutoFill');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังจัด…'; }
  try {
    const result = await api('POST', '/api/schedule/optimize', {
      year: state.year, month: state.month
    });
    if (result.status !== 'ok') {
      const msg = result.message || 'ไม่ทราบสาเหตุ';
      alert(`ไม่สามารถจัดตารางอัตโนมัติได้

${msg}

ลองทำดังนี้:
• เพิ่มเพดาน OT
• ลดชั่วโมงขั้นต่ำของเดือนนี้
• ผ่อนคลายกฎรายบุคคล
• ลบช่องที่ตั้งไว้บางส่วน`);
      updateFileStatus('จัดอัตโนมัติล้มเหลว', true);
      return;
    }
    // Apply schedule. The server's schedule includes every cell for the month;
    // we only overwrite cells that aren't already set with the same value.
    let applied = 0;
    pushUndo();
    for (const empCode in result.schedule) {
      if (!state.shifts[empCode]) state.shifts[empCode] = {};
      for (const dk in result.schedule[empCode]) {
        const v = result.schedule[empCode][dk];
        if (state.shifts[empCode][dk] !== v) {
          state.shifts[empCode][dk] = v;
          applied++;
        }
      }
    }
    saveState({ shifts: true });
    render();
    const stats = result.stats || {};
    const teamOt = stats.teamOt ?? 0;
    const objective = result.objective ?? '';
    alert(`✅ จัดตารางสำเร็จใน ${result.elapsedMs} มิลลิวินาที
อัพเดต ${applied} ช่อง
OT ทีมรวม: ${teamOt} ชม.
คะแนน (ยิ่งต่ำยิ่งดี): ${objective}`);
  } catch (e) {
    alert('จัดตารางอัตโนมัติล้มเหลว: ' + e.message);
    updateFileStatus('เกิดข้อผิดพลาด', true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⚡ จัดอัตโนมัติ'; }
  }
}

// ---------- Excel Import ----------
const MONTH_NAME_TO_IDX = {
  JAN:0, JANUARY:0, FEB:1, FEBRUARY:1, MAR:2, MARCH:2, APR:3, APRIL:3,
  MAY:4, JUN:5, JUNE:5, JUL:6, JULY:6, AUG:7, AUGUST:7,
  SEP:8, SEPT:8, SEPTEMBER:8, OCT:9, OCTOBER:9, NOV:10, NOVEMBER:10, DEC:11, DECEMBER:11
};
// As requested, don't import sheets later than this (inclusive). Adjust if needed.
const IMPORT_MAX_MONTH = 5; // 5 = June

function normalizeShift(raw) {
  if (raw == null) return null;
  const s = String(raw).trim().toUpperCase();
  if (!s) return null;
  if (s === "OFF" || s === "R" || s === "V" || s === "E") return s;
  // Match H-H, HH-HH, with optional :MM on either side; allow en/em-dash
  const m = /^(\d{1,2})(?::(\d{2}))?\s*[-–—]\s*(\d{1,2})(?::(\d{2}))?$/.exec(s);
  if (m) {
    const h1 = String(parseInt(m[1])).padStart(2,"0");
    const mm1 = m[2] || "00";
    const h2 = String(parseInt(m[3])).padStart(2,"0");
    const mm2 = m[4] || "00";
    return `${h1}:${mm1}-${h2}:${mm2}`;
  }
  return null; // unrecognized
}

function importExcel() {
  if (typeof XLSX === "undefined") {
    alert("ไม่สามารถโหลดตัวอ่าน Excel (SheetJS) ได้ กรุณาตรวจสอบอินเทอร์เน็ตและรีเฟรชหน้านี้");
    return;
  }
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".xlsx,.xls,.xlsm";
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const yearMatch = file.name.match(/(20\d{2})/);
    const year = yearMatch ? parseInt(yearMatch[1]) : state.year;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const summary = parseWorkbookIntoState(wb, year);
        // Push the whole imported state to the server in one shot (faster
        // than the debounced incremental sync for large imports).
        await api('POST', '/api/state/import', {
          employees: state.employees,
          shifts: state.shifts,
          minHoursByMonth: state.minHoursByMonth
        });
        lastSavedAt = new Date();
        updateFileStatus();
        render();
        alert(
          `นำเข้า Excel เสร็จสิ้น\n\n` +
          `ปี: ${year}\n` +
          `ชีตที่นำเข้า: ${summary.sheetsImported.join(", ") || "(ไม่มี)"}\n` +
          `ชีตที่ข้าม: ${summary.sheetsSkipped.join(", ") || "(ไม่มี)"}\n` +
          `เพิ่มพนักงาน: ${summary.employeesAdded}\n` +
          `บันทึกเวร: ${summary.shiftsWritten}\n` +
          `ช่องที่ไม่เข้าใจ: ${summary.warnings}` +
          (summary.warningSamples.length ? `\nตัวอย่าง: ${summary.warningSamples.slice(0,5).join(", ")}` : "")
        );
      } catch (err) {
        console.error(err);
        alert("นำเข้า Excel ล้มเหลว: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function parseWorkbookIntoState(wb, year) {
  const summary = {
    sheetsImported: [], sheetsSkipped: [],
    employeesAdded: 0, shiftsWritten: 0,
    warnings: 0, warningSamples: []
  };
  for (const sheetName of wb.SheetNames) {
    const upper = sheetName.toUpperCase().trim();
    const monthIdx = MONTH_NAME_TO_IDX[upper];
    if (monthIdx === undefined) { summary.sheetsSkipped.push(sheetName + " (not a month)"); continue; }
    if (monthIdx > IMPORT_MAX_MONTH) { summary.sheetsSkipped.push(sheetName + " (after cap)"); continue; }

    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });

    // Find header row: col A === "ID" (or contains "ID")
    let hdrIdx = rows.findIndex(r => r && typeof r[0] === "string" && r[0].trim().toUpperCase() === "ID");
    if (hdrIdx < 0) { summary.sheetsSkipped.push(sheetName + " (no ID header)"); continue; }
    const hdr = rows[hdrIdx];

    // Date columns: numeric 1..31 starting at col index 2
    const dayCols = [];
    for (let c = 2; c < hdr.length; c++) {
      const v = hdr[c];
      let day = null;
      if (typeof v === "number" && v >= 1 && v <= 31) day = v;
      else if (typeof v === "string" && /^\s*\d{1,2}\s*$/.test(v)) {
        const n = parseInt(v.trim()); if (n >= 1 && n <= 31) day = n;
      }
      if (day) dayCols.push({ col: c, day });
    }
    if (!dayCols.length) { summary.sheetsSkipped.push(sheetName + " (no day cols)"); continue; }

    // Data rows: any row past header with an ID in col 0 and name in col 1
    for (let r = hdrIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      const id = row[0] == null ? "" : String(row[0]).trim();
      const nameCell = row[1] == null ? "" : String(row[1]).trim();
      if (!id || !nameCell) continue;
      const lines = nameCell.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const empName = lines[0] || nameCell;
      const position = lines.slice(1).join(" ");

      let emp = state.employees.find(e => e.id === id);
      if (!emp) {
        emp = { id, name: empName, position };
        state.employees.push(emp);
        summary.employeesAdded++;
      } else {
        // Refresh name/position from Excel (Excel wins)
        if (empName) emp.name = empName;
        if (position) emp.position = position;
      }

      if (!state.shifts[id]) state.shifts[id] = {};
      for (const { col, day } of dayCols) {
        const raw = row[col];
        if (raw == null || (typeof raw === "string" && raw.trim() === "")) continue;
        const v = normalizeShift(raw);
        if (v === null) {
          summary.warnings++;
          if (summary.warningSamples.length < 10) summary.warningSamples.push(`${sheetName}!${id}/${day}=${JSON.stringify(raw)}`);
          continue;
        }
        state.shifts[id][dateKey(year, monthIdx, day)] = v;
        summary.shiftsWritten++;
      }
    }
    summary.sheetsImported.push(sheetName);
  }
  return summary;
}

function importJson() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json";
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.employees || !data.shifts) throw new Error("invalid");
        state = data;
        saveState(); render();
      } catch (e) { alert("ไฟล์ไม่ถูกต้อง: " + e.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Settings dropdown: hover to preview, click to pin, 200ms grace before
// closing on mouseleave (forgiving if you overshoot or slip off the bridge).
(function wireSettingsDropdown() {
  const trigger = document.getElementById("btnSettings");
  const menu = document.getElementById("settingsMenu");
  const wrap = trigger && trigger.closest(".settings-dropdown");
  if (!trigger || !menu || !wrap) return;

  const HOVER_CLOSE_DELAY = 200;  // ms
  let isPinned = false;
  let closeTimer = null;

  const open = () => {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    menu.classList.add("open");
  };
  const close = () => {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    menu.classList.remove("open");
    isPinned = false;
  };
  const scheduleClose = () => {
    if (isPinned) return;
    if (closeTimer) clearTimeout(closeTimer);
    closeTimer = setTimeout(() => { menu.classList.remove("open"); closeTimer = null; }, HOVER_CLOSE_DELAY);
  };

  wrap.addEventListener("mouseenter", open);
  wrap.addEventListener("mouseleave", scheduleClose);

  trigger.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = menu.classList.contains("open");
    if (isOpen && isPinned) close();          // pinned + click → close
    else if (isOpen) isPinned = true;         // hover-open + click → pin
    else { open(); isPinned = true; }         // closed + click → open & pin
  });

  // Menu item clicks always close
  menu.querySelectorAll("button").forEach(b => b.addEventListener("click", close));
  // Outside click closes
  document.addEventListener("click", e => {
    if (!menu.classList.contains("open")) return;
    if (e.target.closest(".settings-dropdown")) return;
    close();
  });
  // Esc closes
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && menu.classList.contains("open")) close();
  });
})();

})();

function fmtSyncTime(iso) {
  if (!iso) return "ยังไม่เคยซิงค์";
  // SQLite CURRENT_TIMESTAMP is UTC without a zone marker.
  const d = new Date(iso.replace(" ", "T") + "Z");
  return isNaN(d) ? iso : d.toLocaleString("th-TH");
}

function openGoogleSyncModal(empId) {
  const emp = getEmp(empId);
  if (!emp) return;
  const host = document.getElementById("modalHost");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  host.appendChild(bg);
  let poll = null;
  const close = () => { clearInterval(poll); host.innerHTML = ""; render(); };
  bg.addEventListener("click", e => { if (e.target === bg) close(); });

  const draw = () => {
    const link = googleLinkFor(empId);
    let body;
    if (!link) {
      body = `
        <p>เมื่อเชื่อมต่อแล้ว ตารางเวรของ <b>${escapeHtml(emp.name)}</b> จะถูกส่งเข้า Google Calendar
        ในปฏิทินชื่อ <b>"ตารางเวร IICS"</b> และอัปเดตเองทุกครั้งที่ตารางเปลี่ยน (ไม่ต้องดาวน์โหลดไฟล์อีก)</p>
        <ol>
          <li>กด <b>"1. เปิด Google"</b> → เข้าสู่ระบบ Google <u>ของตัวเอง</u> แล้วกด "อนุญาต"
            <span class="muted">(ถ้าเห็น "Google hasn't verified this app" ให้กด Advanced → Go to IICS Scheduler)</span></li>
          ${isServerPc()
            ? `<li>หน้า "เชื่อมต่อสำเร็จ" จะเปิดขึ้น — เสร็จแล้ว ✅</li>`
            : `<li>เบราว์เซอร์จะไปหน้า <b>localhost:3012</b> และขึ้นว่า <i>"ไม่สามารถเข้าถึงไซต์นี้ / refused to connect"</i> — <b>ปกติ ไม่ต้องตกใจ</b></li>
               <li><b>คัดลอกลิงก์ทั้งหมดจากช่องที่อยู่ (address bar)</b> ของหน้านั้น มาวางในช่องด้านล่าง แล้วกด "2. ยืนยัน"</li>`}
        </ol>
        <div class="field" style="margin-top:10px">
          <label>วางลิงก์จาก address bar ที่นี่ (http://localhost:3012/api/google/callback?code=…)</label>
          <input class="paste" placeholder="http://localhost:3012/api/google/callback?code=4/0A…&state=…" />
        </div>
        <div class="status err paste-err" hidden></div>
        <div class="actions">
          <button class="cancel">ปิด</button>
          <span class="spacer"></span>
          <button class="ok connect">1. เปิด Google</button>
          <button class="ok complete">2. ยืนยัน</button>
        </div>`;
    } else {
      const bad = link.status === "reauth" || link.lastError;
      body = `
        <div class="status ${bad ? "err" : "ok"}">
          ${bad ? "⚠️" : "✅"} <b>${link.status === "reauth" ? "ต้องเชื่อมต่อใหม่" : "เชื่อมต่อแล้ว"}</b>
          ${link.email ? `— ${escapeHtml(link.email)}` : ""}<br>
          <span class="muted">ซิงค์ล่าสุด: ${escapeHtml(fmtSyncTime(link.lastSyncAt))}</span>
          ${link.lastError ? `<br><span class="muted">ข้อผิดพลาด: ${escapeHtml(link.lastError)}</span>` : ""}
        </div>
        <p class="muted">เวรจะถูกส่งเข้าปฏิทิน "ตารางเวร IICS" ในบัญชี Google ของ ${escapeHtml(emp.name)} อัตโนมัติเมื่อตารางเปลี่ยน
        (เครื่องเซิร์ฟเวอร์ต้องเปิดและต่ออินเทอร์เน็ตอยู่)</p>
        <div class="actions">
          <button class="danger disconnect">ยกเลิกการเชื่อมต่อ</button>
          <span class="spacer"></span>
          ${link.status === "reauth" && isServerPc() ? `<button class="ok connect">เชื่อมต่อใหม่</button>` : ""}
          <button class="cancel">ปิด</button>
          <button class="ok resync">ซิงค์ใหม่ทั้งหมด</button>
        </div>`;
    }
    bg.innerHTML = `<div class="modal gcal-modal"><h3>Google Calendar — ${escapeHtml(emp.name)}</h3>${body}</div>`;

    bg.querySelector(".cancel").addEventListener("click", close);
    bg.querySelector(".connect")?.addEventListener("click", () => {
      window.open(`/api/google/connect/${encodeURIComponent(empId)}`, "_blank");
      // Watch for the callback to land, then refresh the modal.
      clearInterval(poll);
      let ticks = 0;
      poll = setInterval(async () => {
        const before = JSON.stringify(googleLinkFor(empId));
        await refreshGoogleLinks();
        if (JSON.stringify(googleLinkFor(empId)) !== before) { draw(); }
        if (++ticks > 90) clearInterval(poll);   // stop after ~3 min
      }, 2000);
    });
    bg.querySelector(".complete")?.addEventListener("click", async () => {
      const input = bg.querySelector(".paste").value.trim();
      const errBox = bg.querySelector(".paste-err");
      if (!input) { errBox.textContent = "กรุณาวางลิงก์จาก address bar ก่อน"; errBox.hidden = false; return; }
      const btn = bg.querySelector(".complete");
      btn.disabled = true; btn.textContent = "กำลังเชื่อมต่อ…";
      try {
        const r = await fetch('/api/google/complete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empCode: empId, input }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
        clearInterval(poll);
        await refreshGoogleLinks();
        draw();
      } catch (e) {
        errBox.textContent = "เชื่อมต่อไม่สำเร็จ: " + e.message;
        errBox.hidden = false;
        btn.disabled = false; btn.textContent = "2. ยืนยัน";
      }
    });
    bg.querySelector(".resync")?.addEventListener("click", async () => {
      try {
        await api('POST', `/api/google/resync/${encodeURIComponent(empId)}`);
        alert("กำลังซิงค์ใหม่ทั้งหมด — จะเสร็จภายในไม่กี่วินาที");
        setTimeout(async () => { await refreshGoogleLinks(); draw(); }, 5000);
      } catch (e) { alert("ซิงค์ไม่สำเร็จ: " + e.message); }
    });
    bg.querySelector(".disconnect")?.addEventListener("click", async () => {
      if (!confirm(`ยกเลิกการเชื่อมต่อ Google Calendar ของ ${emp.name}?`)) return;
      const delCal = confirm('ลบปฏิทิน "ตารางเวร IICS" ออกจาก Google Calendar ด้วยหรือไม่?\n\nตกลง = ลบปฏิทินและเวรทั้งหมดใน Google\nยกเลิก = เก็บปฏิทินไว้ (แต่จะไม่อัปเดตอีก)');
      try {
        await api('DELETE', `/api/google/link/${encodeURIComponent(empId)}${delCal ? "?deleteCalendar=1" : ""}`);
        await refreshGoogleLinks();
        draw();
      } catch (e) { alert("ยกเลิกไม่สำเร็จ: " + e.message); }
    });
  };
  draw();
}

// ---------- ICS export per employee ----------
// Generates an RFC 5545 iCalendar file for one employee covering the current
// month. Time-range shifts become timed events; R / V / E become all-day
// events; OFF days produce no event (cleaner calendar).
function exportEmployeeIcs(emp) {
  const year = state.year, month = state.month;
  const dim = daysInMonth(year, month);
  const monthName = THAI_MONTHS[month];
  const SHIFT_NAMES = { R: "คำขอ (Request)", V: "ลาพักร้อน (Vacation)", E: "กิจกรรม (Event)" };
  const pad = n => String(n).padStart(2, "0");
  const dateCompact = (y, m, d) => `${y}${pad(m + 1)}${pad(d)}`;
  // RFC 5545 requires lines to fold at 75 octets; for our short summaries
  // we won't approach that, so we skip folding for simplicity.
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//IICS Shift Scheduler//TH",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    `X-WR-CALNAME:ตารางเวร ${emp.name} - ${monthName} ${year}`,
    "X-WR-TIMEZONE:Asia/Bangkok",
  ];

  let eventCount = 0;
  for (let d = 1; d <= dim; d++) {
    const dk = dateKey(year, month, d);
    const shift = state.shifts[emp.id]?.[dk];
    if (!shift || shift === "OFF") continue;

    const uid = `${emp.id}-${dk}@iics-shift-scheduler`;
    const dtStamp = `${dateCompact(year, month, d)}T000000Z`;

    if (shift === "R" || shift === "V" || shift === "E") {
      // All-day event spanning a single day (DTEND is the day AFTER per ICS spec)
      const nextDay = new Date(year, month, d + 1);
      const startStr = dateCompact(year, month, d);
      const endStr = dateCompact(nextDay.getFullYear(), nextDay.getMonth(), nextDay.getDate());
      lines.push(
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${dtStamp}`,
        `DTSTART;VALUE=DATE:${startStr}`,
        `DTEND;VALUE=DATE:${endStr}`,
        `SUMMARY:${SHIFT_NAMES[shift]}`,
        "TRANSP:OPAQUE",
        "END:VEVENT"
      );
      eventCount++;
    } else {
      // Time-range shift like "08:00-17:00" (assume Asia/Bangkok local time)
      const m = /^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/.exec(shift);
      if (!m) continue;
      const [, sh, sm, eh, em] = m;
      const dateStr = dateCompact(year, month, d);
      // Use floating local time (no Z, no TZID) — Google Calendar interprets
      // these in the importer's local timezone, which is what we want for a
      // Thai hospital schedule being imported by Thai staff.
      const startStr = `${dateStr}T${sh}${sm}00`;
      const endStr   = `${dateStr}T${eh}${em}00`;
      lines.push(
        "BEGIN:VEVENT",
        `UID:${uid}`,
        `DTSTAMP:${dtStamp}`,
        `DTSTART:${startStr}`,
        `DTEND:${endStr}`,
        `SUMMARY:เวร ${shift}`,
        `DESCRIPTION:${emp.name}${emp.position ? " (" + emp.position + ")" : ""}`,
        "TRANSP:OPAQUE",
        "END:VEVENT"
      );
      eventCount++;
    }
  }
  lines.push("END:VCALENDAR");
  const ics = lines.join("\r\n");

  if (eventCount === 0) {
    alert(`ไม่มีเวรของ ${emp.name} ในเดือน ${monthName} ${year}`);
    return;
  }

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  // Sanitize name for filename
  const safeName = (emp.name || emp.id).replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, "_");
  a.download = `${safeName}-${currentMonthKey()}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

async function exportSchedulePng(style = "split") {
  if (typeof html2canvas === "undefined") {
    alert("ไม่สามารถโหลดตัวสร้างรูปภาพได้ กรุณาตรวจสอบอินเทอร์เน็ตและรีเฟรชหน้านี้");
    return;
  }
  const wrap = document.getElementById("tableWrap");
  const origTable = wrap && wrap.querySelector("table.grid");
  if (!origTable) return;
  const btn = document.getElementById("btnExportPng");
  if (btn) { btn.disabled = true; btn.textContent = "📸 กำลังสร้างรูป…"; }

  // Build the off-screen export container with two halves:
  //   [Title bar]
  //   [ครึ่งเดือนแรก]
  //   [table showing days 1–15]
  //   [ครึ่งเดือนหลัง]
  //   [table showing days 16–end]
  const exportRoot = document.createElement("div");
  exportRoot.className = "png-export-root";

  const titleEl = document.createElement("div");
  titleEl.className = "export-title";
  const monthThai = THAI_MONTHS[state.month];
  const minH = getMinHours();
  titleEl.textContent = `ตารางเวร เดือน${monthThai} ${state.year} (ชั่วโมงการทำงาน ${minH} ชั่วโมง)`;
  exportRoot.appendChild(titleEl);

  const totalDays = daysInMonth(state.year, state.month);

  // Compute Employee-column width once via canvas text measurement
  let empColWidthPx = 0;
  {
    const meas = document.createElement("canvas").getContext("2d");
    state.employees.forEach(emp => {
      meas.font = "600 12px Sarabun, sans-serif";
      empColWidthPx = Math.max(empColWidthPx, meas.measureText(emp.name || "").width);
      meas.font = "400 11px Sarabun, sans-serif";
      const metaText = `${emp.id || ""}${emp.position ? " · " + emp.position : ""}`;
      empColWidthPx = Math.max(empColWidthPx, meas.measureText(metaText).width);
    });
    meas.font = "700 12px Sarabun, sans-serif";
    empColWidthPx = Math.max(empColWidthPx, meas.measureText("พนักงาน").width);
    empColWidthPx = Math.ceil(empColWidthPx) + 16;
  }

  // Helper: clone the live table, collapse columns outside the day range,
  // collapse the totals columns + footer rows, and append filler cells so the
  // table reaches a target visible-column count (used so both halves render
  // at the same width).
  function buildHalfTable(startDay, endDay, fillerCount = 0) {
    const t = origTable.cloneNode(true);
    t.querySelector("tfoot")?.remove();
    const cols = t.querySelectorAll("colgroup col");
    cols.forEach((c, i) => {
      if (i === 0) { c.style.width = empColWidthPx + "px"; return; }
      const dayNum = i;
      if (dayNum >= 1 && dayNum <= totalDays) {
        if (dayNum < startDay || dayNum > endDay) c.style.visibility = "collapse";
      } else {
        c.style.visibility = "collapse";
      }
    });

    if (fillerCount > 0) {
      // Add filler <col>, <th>, and <td> entries, inserted BEFORE the totals so
      // they end up visually to the right of the last day column.
      const colgroup = t.querySelector("colgroup");
      const firstTotalCol = colgroup.querySelector("col.col-total");
      const headerRow = t.querySelector("thead tr");
      const firstTotalTh = headerRow.querySelector("th.totals-start");
      for (let f = 0; f < fillerCount; f++) {
        const fc = document.createElement("col");
        fc.className = "col-day";
        colgroup.insertBefore(fc, firstTotalCol);
        const fth = document.createElement("th");
        fth.className = "filler-th";
        fth.innerHTML = "&nbsp;";
        headerRow.insertBefore(fth, firstTotalTh);
      }
      t.querySelectorAll("tbody tr").forEach(tr => {
        const firstTotalTd = tr.querySelector("td.totals-start");
        for (let f = 0; f < fillerCount; f++) {
          const fcell = document.createElement("td");
          fcell.className = "cell filler-cell";
          tr.insertBefore(fcell, firstTotalTd);
        }
      });
    }
    return t;
  }

  function addSubtitle(text) {
    const s = document.createElement("div");
    s.className = "export-subtitle";
    s.textContent = text;
    exportRoot.appendChild(s);
  }

  if (style === "full") {
    // Single table covering days 1..totalDays — no subtitles, no fillers.
    const tFull = buildHalfTable(1, totalDays, 0);
    exportRoot.appendChild(tFull);
  } else {
    // Split into two halves: days 1–15 and 16..totalDays. Pad whichever is
    // shorter so both halves render at exactly the same width.
    const firstHalfCount = 15;
    const secondHalfCount = Math.max(0, totalDays - 15);
    const fillerForFirst = Math.max(0, secondHalfCount - firstHalfCount);
    const fillerForSecond = Math.max(0, firstHalfCount - secondHalfCount);

    addSubtitle("ครึ่งเดือนแรก");
    const t1 = buildHalfTable(1, 15, fillerForFirst);
    exportRoot.appendChild(t1);

    addSubtitle("ครึ่งเดือนหลัง");
    const t2 = buildHalfTable(16, totalDays, fillerForSecond);
    exportRoot.appendChild(t2);
  }

  document.body.appendChild(exportRoot);

  // Wait for layout to settle (col.visibility:collapse takes a frame to apply)
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // Fix container width to the widest visible table so the title bar (and
  // subtitles, in split mode) spans the full visible schedule with no white
  // side strips.
  const tables = exportRoot.querySelectorAll("table.grid");
  let targetWidth = 0;
  tables.forEach(t => { targetWidth = Math.max(targetWidth, t.offsetWidth); });
  exportRoot.style.width = targetWidth + "px";

  await new Promise(r => requestAnimationFrame(r));

  try {
    const canvas = await html2canvas(exportRoot, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      logging: false,
      width: targetWidth,
      windowWidth: targetWidth + 32,
    });
    canvas.toBlob(blob => {
      if (!blob) { alert("สร้างรูป PNG ไม่สำเร็จ"); return; }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `schedule-${currentMonthKey()}${style === "split" ? "-split" : ""}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }, "image/png");
  } catch (e) {
    console.error("PNG export failed:", e);
    alert("ดาวน์โหลด PNG ล้มเหลว: " + e.message);
  } finally {
    exportRoot.remove();
    if (btn) { btn.disabled = false; btn.textContent = "🖼 ดาวน์โหลดรูป ▾"; }
  }
}

document.getElementById("btnClear").addEventListener("click", () => {
  if (checkLock()) return;
  if (!confirm("ล้างตารางเวรทั้งหมดของเดือนนี้?")) return;
  pushUndo();
  const days = daysInMonth(state.year, state.month);
  for (const emp of state.employees) {
    if (!state.shifts[emp.id]) continue;
    for (let d = 1; d <= days; d++) {
      const dk = dateKey(state.year, state.month, d);
      if (state.shifts[emp.id][dk] != null) {
        delete state.shifts[emp.id][dk];
        pendingShiftDeletes.push({ empCode: emp.id, dateKey: dk });
      }
    }
  }
  saveState({ shifts: true }); render();
});
function orderedSelection() {
  // Row-major: employees in display order, then date columns
  const out = [];
  const days = daysInMonth(state.year, state.month);
  for (const emp of state.employees) {
    for (let d = 1; d <= days; d++) {
      const dk = dateKey(state.year, state.month, d);
      const key = emp.id + "|" + dk;
      if (selection.has(key)) out.push({ empId: emp.id, dk });
    }
  }
  return out;
}
function copySelectionToClipboard() {
  const items = orderedSelection();
  if (!items.length) return;
  clipboard = items.map(({empId, dk}) => state.shifts[empId]?.[dk] || "");
  // Visually mark the copied cells with a dashed teal outline
  copiedKeys = new Set(items.map(({empId, dk}) => empId + "|" + dk));
  repaintCopied();
  // Also push to OS clipboard as TSV for convenience
  const tsv = clipboard.join("\t");
  if (navigator.clipboard) navigator.clipboard.writeText(tsv).catch(() => {});
  document.getElementById("saveStatus").textContent = `คัดลอก ${clipboard.length} ช่อง`;
}
function pasteFromClipboard() {
  if (checkLock()) return;
  if (!clipboard.length) return;
  pushUndo();
  const items = orderedSelection();
  if (!items.length) return;
  items.forEach(({empId, dk}, i) => {
    const val = clipboard[i % clipboard.length];
    if (!state.shifts[empId]) state.shifts[empId] = {};
    if (val === "" || val == null) {
      delete state.shifts[empId][dk];
      pendingShiftDeletes.push({ empCode: empId, dateKey: dk });
    } else state.shifts[empId][dk] = val;
  });
  saveState({ shifts: true });
  render();
}

document.addEventListener("keydown", e => {
  // Don't hijack typing in inputs (modal/popover fields, in-cell edit)
  const t = e.target;
  const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT");

  if (e.key === "Escape") { closePopover(); clearSelection(); copiedKeys.clear(); render(); return; }
  if (e.key === "Delete" && selection.size && !typing) { applyToSelection(""); return; }
  if ((e.ctrlKey || e.metaKey) && !typing) {
    if (e.key === "c" || e.key === "C") { copySelectionToClipboard(); e.preventDefault(); }
    else if (e.key === "v" || e.key === "V") { pasteFromClipboard(); e.preventDefault(); }
    else if (e.key === "z" || e.key === "Z") {
      // Ctrl+Z = undo, Ctrl+Shift+Z = redo
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    }
    else if (e.key === "y" || e.key === "Y") { e.preventDefault(); redo(); }
    return;
  }

  // If focus is in any text input (popover, modal, in-cell editor), let
  // it handle the key — we don't want to hijack arrow navigation or type
  // triggers.
  if (typing) return;

  // Arrow-key navigation between cells
  if (e.key === "ArrowUp")    { e.preventDefault(); moveCellSelection("up",    e.shiftKey); return; }
  if (e.key === "ArrowDown")  { e.preventDefault(); moveCellSelection("down",  e.shiftKey); return; }
  if (e.key === "ArrowLeft")  { e.preventDefault(); moveCellSelection("left",  e.shiftKey); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); moveCellSelection("right", e.shiftKey); return; }

  // Select-then-type: if any cell is the "current" (cursor / anchor) cell
  // and the user pressed a printable character, enter edit mode with that
  // character as the initial input.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const isPrintable = e.key.length === 1 && /[\w\-:.]/i.test(e.key);
  if (!isPrintable) return;
  // If a stale editingCellKey is lingering (e.g. an earlier edit's blur
  // never fired), clear it now so we can start a fresh edit.
  if (editingCellKey && !document.querySelector(".cell-edit-input")) {
    editingCellKey = null;
  }
  const targetKey = cursorKey
    || anchorKey
    || (selection.size ? selection.values().next().value : null);
  if (!targetKey) {
    console.log("[type] no target cell — click a cell first to set the cursor");
    return;
  }
  const [empId, dk] = targetKey.split("|");
  const td = document.querySelector(`td.cell[data-emp="${empId}"][data-date="${dk}"]`);
  if (!td) {
    console.log("[type] cursor cell not in DOM (cursorKey =", targetKey, "). Did the month change?");
    return;
  }
  if (isCurrentMonthLocked()) {
    console.log("[type] month is locked — edits disabled until you move to a newer month");
    flashCellInvalid(td);
    return;
  }
  e.preventDefault();
  console.log("[type] starting edit on", targetKey, "with key:", JSON.stringify(e.key));
  startEditingCell(td, e.key);
});

render();
// On startup: pull the full state from the Node + SQLite backend.
loadStateFromServer();
</script>
</body>
